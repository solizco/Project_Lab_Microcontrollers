board = upesy_wroom
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs

lib_deps =
    madhephaestus/ESP32Servo
    moononournation/GFX Library for Arduino @ 1.4.7
    bitbank2/JPEGDEC