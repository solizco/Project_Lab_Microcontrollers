# ============================================================
# Connect 4 gantry pins for the Raspberry Pi 4
# ============================================================
# Fill in the BCM GPIO number for each wire (GPIO17 -> 17).
# These are NOT the physical pin numbers on the header.
# Leave a value blank if that part is not connected.
# Save the file, then restart the game (or the Pi). No rebuild needed.
#
# Rules:
#  - Buttons, the shutdown button and the limit switch connect the GPIO to GND
#    when pressed (the Pi turns on its internal pull-ups).
#  - SERVO on GPIO 12, 13, 18 or 19 uses the Pi's hardware PWM (smooth). Any
#    other pin works too, but the servo may twitch. After changing SERVO, run
#    install_autostart.sh again so it sets up the PWM for the new pin.
#  - Tip: put EN on GPIO 0-8. Those are pulled HIGH while the Pi boots, so the
#    motor stays off until the game starts.
#  - Never connect 5 V or the motor supply to a GPIO pin. 3.3 V logic only.
#  - Avoid GPIO 2 and 3 (I2C, and GPIO 3 is the optional Pi power button).

# ---- stepper driver (TMC2209) ----
STEP = GPIO27
DIR = GPIO17
EN = GPIO22

# ---- limit switch (home) ----
LIMIT = GPIO14

# ---- dispenser servo (signal wire) ----
SERVO = GPIO12      # physical pin 32 (hardware PWM, grounds on pins 30 and 34)

# ---- buttons ----
BTN_LEFT = GPIO15
BTN_RIGHT = GPIO24
BTN_SELECT = GPIO23
BTN_SHUTDOWN = GPIO25

# ---- mechanics (same as the ESP32 version; only change if the hardware changed) ----
STEPS_PER_MM = 39.46
FIRST_COLUMN_MM = 23.6
COLUMN_SPACING_MM = 33.3
STEP_DELAY_US = 500
HOMING_STEP_DELAY_US = 800
MAX_HOMING_STEPS = 11000
# 1 = the motor runs the wrong way (away from the limit switch when homing)
INVERT_DIR = 0
# 1 = TMC2209 style (EN low = motor on). 0 = EN high = motor on.
EN_ACTIVE_LOW = 1
# 1 = limit switch wired C + NC (reads pressed when it is not). Better: wire C + NO and keep 0.
LIMIT_INVERT = 0
# The switch must read pressed this many ms in a row (motor paused) to count.
# Rejects motor noise on the switch wire. Raise it if homing stops before the switch.
LIMIT_FILTER_MS = 3
SERVO_MIN_US = 500
SERVO_MAX_US = 2500
# 1 = keep the servo powered at rest between drops (holds the silos shut). 0 = go limp.
SERVO_HOLD = 1
# 1 = never use hardware PWM for the servo (only if hardware PWM misbehaves).
SERVO_FORCE_SOFTWARE = 0
# 1 = wiggle the servo a few degrees at start-up so you can see it is alive.
SERVO_BOOT_TEST = 0
# 1 = touch the limit switch, back off 3 mm, touch it again slowly. Noise can't fake both.
TWO_TOUCH_HOMING = 1
# A button must read pressed this many ms in a row to count (rejects motor noise).
BUTTON_STABLE_MS = 25
# 1 = pressing LEFT and RIGHT together is SELECT (BTN_SELECT can then stay blank).
CHORD_SELECT = 1
# The second arrow must land within this many ms of the first to count as select.
CHORD_WINDOW_MS = 150
# Motor off after this many seconds without moving (cooler driver, longer battery).
# The gantry homes again before its next move. 0 = never turn it off.
IDLE_MOTOR_OFF_S = 300
