; Motion Controller: motion only (no display, no filesystem, no JPEG).
; If your existing motion env uses a different board id, keep yours.
[platformio]
default_envs = motion_controller

[env:motion_controller]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo
